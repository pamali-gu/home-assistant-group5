# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

logger:
  default: info
  logs:
    homeassistant.components.cloud: debug
    homeassistant.components.lightmap: debug

panel_custom:
  - name: light-map-panel
    url_path: light-map
    sidebar_title: Light Map
    sidebar_icon: mdi:map
    module_url: /local/light-map-panel.js
    config:
      hello: world

# Define media directories here
homeassistant:
  media_dirs:
    local: config/media

sensor:
  - platform: template
    sensors:
      mock_light_sensor_1:
        friendly_name: "light_sensor_1"
        unit_of_measurement: "lux"
        attribute_templates:
          unique_id: "mock_light_1"
        value_template: "4095"
      mock_light_sensor_2:
        friendly_name: "light_sensor_2"
        unit_of_measurement: "lux"
        attribute_templates:
          unique_id: "mock_light_2"
        value_template: "200"
      mock_light_sensor_3:
        friendly_name: "light_sensor_3"
        unit_of_measurement: "lux"
        attribute_templates:
          unique_id: "mock_light_3"
        value_template: "2098"
      mock_light_sensor_4:
        friendly_name: "light_sensor_4"
        unit_of_measurement: "lux"
        attribute_templates:
          unique_id: "mock_light_4"
        value_template: "3123"
      mock_light_sensor_5:
        friendly_name: "light_sensor_5"
        unit_of_measurement: "lux"
        attribute_templates:
          unique_id: "mock_light_5"
        value_template: "1427"
      mock_light_sensor_6:
        friendly_name: "light_sensor_6"
        unit_of_measurement: "lux"
        attribute_templates:
          unique_id: "mock_light_6"
        value_template: "2703"

lightmap:
  gemini_api_key: !secret gemini_api_key
